name: Release

# Triggers on a v*.*.* tag push and performs the complete release:
# builds and smoke tests the agent, signs and publishes it to Maven
# Central, waits for it to land on repo1, and only then creates the
# GitHub Release with the exact same signed artifacts attached.
#
# Ordering is deliberate: Central publishing is irreversible and is the
# release that matters, so it happens first and gates everything after
# it. A failed Central publish therefore leaves no GitHub Release behind,
# which is what previously allowed a version to exist on GitHub but not
# on Central (v2.0.6).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Central's publishing plugin blocks until the deployment reaches the
    # PUBLISHED state (waitMaxTime=7200 in the root pom), and the repo1
    # poll below adds up to 30 more minutes.
    timeout-minutes: 150
    env:
      # Public key id of the Keploy release signing key. Selects the right
      # secret key when more than one is present in the keyring.
      GPG_KEY_ID: 8541784E4EC36FB8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server entry that
          # resolves from the env vars named below, and imports the
          # release signing key (removed again when the job ends).
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version in poms
        run: >-
          mvn -B -ntp versions:set
          -DnewVersion=${{ steps.ver.outputs.version }}
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Build and smoke test the agent
        # Pre-flight gate on a plain (unsigned) build: publishing to Central
        # cannot be undone, so the agent is proven to actually attach and
        # run before anything leaves this job.
        run: |
          mvn -B -ntp -DskipTests clean verify
          ./scripts/smoke-javaagent.sh

      - name: Publish to Maven Central
        # Single clean build so the artifacts staged for the GitHub Release
        # below are byte-identical to the ones published to Central. The
        # `release` profile attaches sources + javadoc, signs everything
        # with maven-gpg-plugin, and deploys via central-publishing-maven-plugin.
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn -B -ntp -P release -DskipTests clean deploy
          -Dgpg.keyname="$GPG_KEY_ID"
          -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
          -Dgpg.useagent=false

      - name: Wait for artifact on Maven Central
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          artifact_url="https://repo.maven.apache.org/maven2/io/keploy/keploy-sdk/${VERSION}/keploy-sdk-${VERSION}.jar"
          echo "Waiting for $artifact_url"
          for attempt in $(seq 1 60); do
            if curl -fsI "$artifact_url" >/dev/null; then
              echo "Released artifact is available on Maven Central"
              exit 0
            fi
            echo "Artifact not available yet, retrying in 30s ($attempt/60)"
            sleep 30
          done
          echo "Released artifact is not available on Maven Central after 30 minutes"
          exit 1

      - name: Stage release assets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euxo pipefail
          # Non-matching globs expand to nothing rather than to the literal
          # pattern, so the signature copy below cannot create junk files.
          shopt -s nullglob
          mkdir -p release-assets
          cp "keploy-sdk/target/keploy-sdk-${VERSION}.jar" "release-assets/keploy-sdk-${VERSION}.jar"
          # Unversioned copy so docs and scripts can link a stable filename.
          cp "keploy-sdk/target/keploy-sdk-${VERSION}.jar" "release-assets/keploy-sdk.jar"
          cp "keploy-sdk/target/keploy-sdk-${VERSION}-sources.jar" "release-assets/"
          cp "keploy-sdk/target/keploy-sdk-${VERSION}-javadoc.jar" "release-assets/"
          cp "keploy-sdk/pom.xml" "release-assets/keploy-sdk-${VERSION}.pom"
          # Detached GPG signatures, so the release assets can be verified
          # against the same key that signed the Central artifacts.
          for f in keploy-sdk/target/keploy-sdk-"${VERSION}"*.jar.asc; do
            cp "$f" "release-assets/"
          done
          ls -la release-assets/

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          # Pre-release flag: anything with a hyphen suffix (e.g. v2.0.6-rc1)
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          # Idempotent publish: if a previous run already created the
          # release record, --clobber overwrites partial assets so a
          # rerun ends in the same state either way.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber"
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              release-assets/*
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Java SDK $TAG" \
              --target "${{ github.sha }}" \
              --generate-notes \
              "${prerelease_flag[@]}" \
              release-assets/*
          fi
